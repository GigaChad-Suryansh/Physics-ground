name: Physics Playground Autonomous Developer

on:
  # No GitHub "schedule" on purpose: GitHub's timer starts hours late. The daily start comes from
  # cron-job.org (13:45 IST, after Gemini's free quota resets at 12:30 IST) calling this
  # workflow_dispatch endpoint. Run by hand: Actions > Run workflow.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: physics-playground-autonomous-developer
  cancel-in-progress: false

jobs:
  autonomous-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate roadmap before run
        run: node scripts/validate-roadmap.mjs

      - name: Record baseline test and build results
        id: baseline
        shell: bash
        run: |
          set +e
          npm test > /tmp/physics-baseline-tests.log 2>&1
          test_exit=$?
          npm run build > /tmp/physics-baseline-build.log 2>&1
          build_exit=$?
          {
            echo "## Autonomous agent baseline"
            echo "- Tests exit code: $test_exit"
            echo "- Build exit code: $build_exit"
            echo '### Test output'
            cat /tmp/physics-baseline-tests.log
            echo '### Build output'
            cat /tmp/physics-baseline-build.log
          } >> "$GITHUB_STEP_SUMMARY"
          echo "test_exit=$test_exit" >> "$GITHUB_OUTPUT"
          echo "build_exit=$build_exit" >> "$GITHUB_OUTPUT"

      # Checks the API key and finds a model that really has free quota *before*
      # the agent starts, so a quota/key problem fails fast with a clear message.
      - name: Select a working Gemini model
        id: pick
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/pick-gemini-model.mjs

      # Deterministic work (which concept is next, which files exist, what the
      # baseline says) is done here, so the agent spends its few turns building.
      - name: Prepare agent brief
        id: brief
        env:
          TEST_EXIT: ${{ steps.baseline.outputs.test_exit }}
          BUILD_EXIT: ${{ steps.baseline.outputs.build_exit }}
        run: node scripts/agent-brief.mjs

      - name: Run Gemini CLI developer
        id: gemini
        continue-on-error: true
        if: steps.pick.outcome == 'success' && steps.brief.outputs.phase != '3'
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ steps.pick.outputs.model }}
          upload_artifacts: true
          gemini_debug: false
          prompt: |
            You are the repository's autonomous physics-simulation developer. Follow GEMINI.md and the brief below exactly.
            Never claim deployment; never add concept 101; never weaken tests. Do not commit, push, create branches, or open PRs; the workflow makes the PR.

            ${{ steps.brief.outputs.prompt }}
          settings: |
            {
              "model": { "maxSessionTurns": 20 },
              "tools": {
                "core": ["run_shell_command", "read_file", "write_file", "replace"],
                "allowed": [
                  "read_file", "write_file", "replace",
                  "run_shell_command(npm)", "run_shell_command(node)", "run_shell_command(npx)",
                  "run_shell_command(ls)", "run_shell_command(cat)", "run_shell_command(head)",
                  "run_shell_command(tail)", "run_shell_command(grep)", "run_shell_command(find)",
                  "run_shell_command(wc)", "run_shell_command(git status)", "run_shell_command(git diff)"
                ]
              },
              "telemetry": { "enabled": false }
            }

      # Free-tier quota is per model. If the first attempt failed, try the
      # next working model once (it continues from whatever is on disk).
      - name: Retry Gemini CLI developer with fallback model
        id: gemini_retry
        if: always() && steps.gemini.outcome == 'failure' && steps.pick.outputs.fallback_model != '' && steps.brief.outputs.phase != '3'
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ steps.pick.outputs.fallback_model }}
          upload_artifacts: true
          gemini_debug: false
          prompt: |
            You are the repository's autonomous physics-simulation developer. Follow GEMINI.md and the brief below exactly.
            Never claim deployment; never add concept 101; never weaken tests. Do not commit, push, create branches, or open PRs; the workflow makes the PR.
            NOTE: an earlier attempt in this run failed part-way. Run `git status --short` first and continue from what is already on disk rather than starting over.

            ${{ steps.brief.outputs.prompt }}
          settings: |
            {
              "model": { "maxSessionTurns": 20 },
              "tools": {
                "core": ["run_shell_command", "read_file", "write_file", "replace"],
                "allowed": [
                  "read_file", "write_file", "replace",
                  "run_shell_command(npm)", "run_shell_command(node)", "run_shell_command(npx)",
                  "run_shell_command(ls)", "run_shell_command(cat)", "run_shell_command(head)",
                  "run_shell_command(tail)", "run_shell_command(grep)", "run_shell_command(find)",
                  "run_shell_command(wc)", "run_shell_command(git status)", "run_shell_command(git diff)"
                ]
              },
              "telemetry": { "enabled": false }
            }

      # The agent must not change its own automation. (The default token also
      # cannot push workflow-file edits, which would make the PR step fail.)
      - name: Revert any agent changes to protected files
        if: always()
        shell: bash
        run: |
          git checkout -- .github scripts GEMINI.md roadmap/physics-concepts.json roadmap/progress.json 2>/dev/null || true
          git clean -fdq -- .github scripts 2>/dev/null || true

      # The agent's own report is never trusted: run the real build and tests.
      - name: Verify agent output
        id: verify1
        if: always()
        env:
          VERIFY_LABEL: after agent
        run: node scripts/verify.mjs

      # One repair attempt, fed the real compiler/test errors.
      - name: Repair failed checks with Gemini
        id: repair
        if: always() && steps.verify1.outputs.ok == 'false' && steps.verify1.outputs.changed == 'true' && steps.pick.outcome == 'success' && steps.brief.outputs.phase != '3'
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ steps.pick.outputs.fallback_model || steps.pick.outputs.model }}
          upload_artifacts: true
          gemini_debug: false
          prompt: |
            You are the repository's autonomous physics-simulation developer. Follow GEMINI.md.
            The work currently in the working tree FAILS the build/tests. Fix ONLY these errors; do not add features, do not delete or weaken tests.
            Use the exact component prop names from the API reference in the brief below. After editing, run `npx tsc --noEmit` and `npm test` until both pass.
            Do not commit, push, or touch .github/, scripts/, or GEMINI.md.

            ## Errors to fix
            ${{ steps.verify1.outputs.errors }}

            ${{ steps.brief.outputs.prompt }}
          settings: |
            {
              "model": { "maxSessionTurns": 20 },
              "tools": {
                "core": ["run_shell_command", "read_file", "write_file", "replace"],
                "allowed": [
                  "read_file", "write_file", "replace",
                  "run_shell_command(npm)", "run_shell_command(node)", "run_shell_command(npx)",
                  "run_shell_command(ls)", "run_shell_command(cat)", "run_shell_command(head)",
                  "run_shell_command(tail)", "run_shell_command(grep)", "run_shell_command(find)",
                  "run_shell_command(wc)", "run_shell_command(git status)", "run_shell_command(git diff)"
                ]
              },
              "telemetry": { "enabled": false }
            }

      - name: Revert protected files again
        if: always()
        shell: bash
        run: |
          git checkout -- .github scripts GEMINI.md roadmap/physics-concepts.json roadmap/progress.json 2>/dev/null || true
          git clean -fdq -- .github scripts 2>/dev/null || true

      # Step 3 of a concept is pure bookkeeping, done by a script (no AI, no quota).
      - name: Mark the concept complete (step 3)
        id: finalize
        if: always() && steps.brief.outputs.phase == '3'
        env:
          CONCEPT_ID: ${{ steps.brief.outputs.concept_id }}
        run: node scripts/finalize-concept.mjs

      - name: Final verification
        id: verify
        if: always()
        env:
          VERIFY_LABEL: final
        run: node scripts/verify.mjs

      # Record a verified step 1/2 (the agent never edits roadmap files itself).
      - name: Record verified progress
        id: advance
        if: always() && steps.verify.outputs.ok == 'true' && steps.verify.outputs.changed == 'true' && (steps.brief.outputs.phase == '1' || steps.brief.outputs.phase == '2')
        env:
          CONCEPT_ID: ${{ steps.brief.outputs.concept_id }}
          PHASE: ${{ steps.brief.outputs.phase }}
        run: node scripts/advance-progress.mjs

      # Never ship work that does not build: drop it and record the failure.
      - name: Discard unverified agent work
        id: discard
        if: always() && steps.verify.outputs.ok == 'false' && steps.verify.outputs.changed == 'true'
        env:
          CONCEPT_ID: ${{ steps.brief.outputs.concept_id }}
          FAIL_NOTE: ${{ steps.verify.outputs.errors }}
        run: node scripts/discard-agent-work.mjs

      - name: Append daily run log
        if: always()
        shell: bash
        env:
          GEMINI_OUTCOME: ${{ steps.gemini_retry.outcome == 'success' && 'success (fallback model)' || (steps.pick.outcome != 'success' && 'skipped (no working model - see pre-flight summary)') || steps.gemini.outcome }}
          GEMINI_MODEL_USED: ${{ steps.gemini_retry.outcome == 'success' && steps.pick.outputs.fallback_model || steps.pick.outputs.model }}
          BASELINE_TEST_EXIT: ${{ steps.baseline.outputs.test_exit }}
          BASELINE_BUILD_EXIT: ${{ steps.baseline.outputs.build_exit }}
          VERIFY_OK: ${{ steps.verify.outputs.ok }}
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
          DISCARDED_FILES: ${{ steps.discard.outputs.discarded_files }}
          GEMINI_ERROR: ${{ steps.gemini.outputs.error || steps.gemini_retry.outputs.error }}
          GEMINI_SUMMARY: ${{ steps.gemini.outputs.summary }}
        run: |
          set -euo pipefail
          mkdir -p roadmap
          if [ ! -f roadmap/daily-log.md ]; then
            cat > roadmap/daily-log.md <<'EOF'
          # Physics Playground — Daily Agent Log

          Each entry records one GitHub Actions run. Persistent state lives in progress.json; this log is a human-readable audit trail. A failed run is not counted as completed work unless its report and code confirm that.
          EOF
            printf '\n' >> roadmap/daily-log.md
          fi
          day_number=$(($(grep -c '^## Day ' roadmap/daily-log.md || true) + 1))
          date_utc=$(date -u '+%Y-%m-%d')
          {
            printf '## Day %s — %s\n\n' "$day_number" "$date_utc"
            printf -- '- **Workflow run:** [#%s](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf -- '- **Trigger:** %s\n' "$GITHUB_EVENT_NAME"
            printf -- '- **Gemini status:** %s\n' "$GEMINI_OUTCOME"
            printf -- '- **Gemini model:** %s\n' "${GEMINI_MODEL_USED:-none}"
            printf -- '- **Baseline tests exit code:** %s (0 = passed)\n' "$BASELINE_TEST_EXIT"
            printf -- '- **Baseline build exit code:** %s (0 = passed)\n' "$BASELINE_BUILD_EXIT"
            printf -- '- **Independent verification (build + tests):** %s\n' "$([ "$VERIFY_OK" = "true" ] && echo passed || echo FAILED)"
            printf -- '- **Repair attempt:** %s\n' "${REPAIR_OUTCOME:-skipped}"
            if [ -n "${DISCARDED_FILES:-}" ]; then
              printf -- '- **Agent work discarded (did not build/pass tests):** %s\n' "$DISCARDED_FILES"
            fi
            if [ -n "${GEMINI_ERROR:-}" ]; then
              printf -- '- **Gemini error output:** %s\n' "$(printf '%s' "$GEMINI_ERROR" | tr '\n' ' ' | tail -c 1800)"
            fi
            if [ -n "${GEMINI_SUMMARY:-}" ]; then
              printf -- '- **Gemini summary:** %s\n' "$(printf '%s' "$GEMINI_SUMMARY" | tr '\n' ' ' | cut -c1-800)"
            fi
            printf -- '- **Changes present after verification:**\n'
            changed_files=$(git status --short | sed '/roadmap\/daily-log\.md/d' || true)
            if [ -n "$changed_files" ]; then
              printf '%s\n' "$changed_files" | sed 's/^/  - `/; s/$/`/'
            else
              printf '  - No uncommitted file changes detected.\n'
            fi
            printf '\n'
            printf -- '- **Saved progress snapshot:**\n'
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          try {
            const p = JSON.parse(fs.readFileSync('roadmap/progress.json', 'utf8'));
            const fields = [['Last outcome', p.last_outcome], ['Last run', p.last_run], ['Current task', p.current_task], ['Last completed concept ID', p.last_completed_id], ['Completed concepts', Array.isArray(p.completed_ids) ? p.completed_ids.length : 'unknown'], ['Notes', p.notes]];
            for (const [label, value] of fields) {
              if (value !== null && value !== undefined && value !== '') {
                const rendered = typeof value === 'string' ? value.replace(/\s+/g, ' ') : JSON.stringify(value);
                console.log(`  - **${label}:** ${rendered}`);
              }
            }
          } catch (error) { console.log('  - Could not read progress.json: ' + error.message); }
          NODE
            printf '\n---\n\n'
          } >> roadmap/daily-log.md

      - name: Validate roadmap after run
        if: always()
        run: node scripts/validate-roadmap.mjs

      - name: Open or update review pull request
        id: pr
        if: always()
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          # Optional: add a fine-grained PAT as secret PR_TOKEN (Pull requests: write,
          # Contents: write) to avoid enabling the repository setting described below.
          token: ${{ secrets.PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: automation/physics-playground-daily
          delete-branch: true
          title: "chore: autonomous Physics Playground maintenance and run log"
          commit-message: "chore: autonomous Physics Playground maintenance and run log"
          body: |
            Automated proposal from the daily Gemini developer workflow.

            - Existing bugs and failing checks must be handled before roadmap features.
            - The fixed roadmap has exactly 100 concepts.
            - Please review the diff, test results, and progress state before merging.
            - This PR is not deployed until merged to the deployment branch.

      # Auto-merge: only when the workflow's own build + tests + roadmap checks
      # passed on this exact tree. Turn it off with the repository variable
      # AUTO_MERGE = false (Settings > Secrets and variables > Actions > Variables).
      - name: Merge the pull request (verified work only)
        id: automerge
        if: >-
          always() && steps.pr.outcome == 'success'
          && (steps.verify.outputs.ok == 'true' || steps.discard.outcome == 'success')
          && steps.pr.outputs.pull-request-number != ''
          && steps.pr.outputs.pull-request-operation != 'closed'
          && vars.AUTO_MERGE != 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" -f merge_method=squash \
            -f commit_title="chore: autonomous Physics Playground update (verified)"
          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the site deploy ourselves.
          gh workflow run deploy.yml --ref main
          echo "## Auto-merged PR #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "Build, tests and roadmap validation passed on this exact code, so it was merged and a deploy was started." >> "$GITHUB_STEP_SUMMARY"

      - name: Explain auto-merge failure
        if: always() && steps.automerge.outcome == 'failure'
        run: echo "::warning title=Auto-merge skipped::The PR is open and verified; merge it by hand (the branch may be protected or a merge setting is blocking it)."

      # Daily report: one comment per run on a single "Daily agent report" issue.
      # GitHub turns that into an email / phone push (@mention guarantees it).
      - name: Post daily report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GEMINI_OK: ${{ steps.gemini.outcome == 'success' || steps.gemini_retry.outcome == 'success' }}
          PICK_OK: ${{ steps.pick.outcome == 'success' }}
          BRIEF_OK: ${{ steps.brief.outcome == 'success' }}
          VERIFIED: ${{ steps.verify.outputs.ok }}
          CHANGED: ${{ steps.verify.outputs.changed }}
          MERGED: ${{ steps.automerge.outcome == 'success' }}
          DISCARDED: ${{ steps.discard.outcome == 'success' }}
          CONCEPT_ID: ${{ steps.brief.outputs.concept_id }}
          PHASE: ${{ steps.brief.outputs.phase }}
          FINALIZED: ${{ steps.finalize.outcome == 'success' }}
        continue-on-error: true
        run: |
          [ "$PHASE" = "3" ] && GEMINI_OK=true
          if [ "$PICK_OK" != "true" ] && [ "$PHASE" != "3" ]; then icon="⏸️"; msg="No Gemini model was available (most likely the free daily quota). Nothing changed; it will try again next run."
          elif [ "$BRIEF_OK" != "true" ]; then icon="❌"; msg="The workflow could not prepare today's task for Gemini (an internal error, not Gemini). Nothing changed. See the run details."
          elif [ "$DISCARDED" = "true" ]; then icon="⚠️"; msg="Gemini's work for concept ${CONCEPT_ID} failed the build/tests and was discarded. Nothing broken was merged; the failure note was saved so the next run can learn from it."
          elif [ "$GEMINI_OK" != "true" ]; then icon="❌"; msg="Gemini failed on every attempt. Nothing changed."
          elif [ "$VERIFIED" = "true" ] && [ "$CHANGED" != "true" ]; then icon="ℹ️"; msg="Run finished with no code changes."
          elif [ "$MERGED" = "true" ]; then icon="✅"; msg="Concept ${CONCEPT_ID}: $( [ "$FINALIZED" = "true" ] && echo "marked complete (step 3 of 3)" || echo "step ${PHASE} of 3 built, verified, merged and deployed" )."
          else icon="👀"; msg="Work is verified but was not auto-merged. Please review the open pull request."
          fi
          body="@${OWNER} ${icon} **$(date -u +%Y-%m-%d)** — ${msg}"$'\n\n'"[Run details](${RUN_URL})"
          num=$(gh issue list --state open --search '"Daily agent report" in:title' --json number --jq '.[0].number' || true)
          if [ -z "$num" ]; then
            num=$(gh issue create --title "Daily agent report" --body "One comment per daily run of the Physics Playground agent. Subscribe to this issue to get each report by email or phone." | grep -o '[0-9]*$')
          fi
          gh issue comment "$num" --body "$body"

      - name: Explain pull request failure
        if: always() && steps.pr.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Pull request could not be created"
            echo
            echo "The agent's work **was pushed** to the branch \`automation/physics-playground-daily\`, but GitHub refused to open the PR."
            echo
            echo "**Fix (one time):** repository **Settings → Actions → General → Workflow permissions** → tick **Allow GitHub Actions to create and approve pull requests** → **Save**."
            echo
            echo "Until then you can open the PR by hand: https://github.com/${GITHUB_REPOSITORY}/compare/main...automation/physics-playground-daily?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Enable PR creation::Settings > Actions > General > Workflow permissions > tick 'Allow GitHub Actions to create and approve pull requests'. The branch automation/physics-playground-daily already has the changes."
          exit 1

      # The first attempt is allowed to fail (the fallback model may recover).
      # The run is only red if no attempt produced a result.
      - name: Fail if no Gemini attempt succeeded
        if: always() && steps.gemini.outcome == 'failure' && steps.gemini_retry.outcome != 'success'
        run: |
          echo "::error::Gemini failed on every attempt. See roadmap/daily-log.md on the automation branch."
          exit 1
